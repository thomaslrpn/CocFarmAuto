<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icône CoC AutoFarm : une pièce d'or examinée à la loupe (analyse du butin). Création originale. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4e9a"/>
      <stop offset="1" stop-color="#0d1b36"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#f2b31b"/>
      <stop offset="1" stop-color="#b87700"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#bfe0ff" stop-opacity="0.08"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="210" fill="url(#bg)"/>
  <!-- Pièce d'or -->
  <circle cx="440" cy="430" r="250" fill="url(#coin)" stroke="#8a5a00" stroke-width="22"/>
  <circle cx="440" cy="430" r="185" fill="none" stroke="#c98500" stroke-width="16" opacity="0.8"/>
  <!-- Courbe de rendement dans la pièce -->
  <polyline points="330,500 400,440 455,470 550,350" fill="none" stroke="#7a4b00" stroke-width="34"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Loupe -->
  <line x1="745" y1="745" x2="855" y2="855" stroke="#0a1428" stroke-width="118" stroke-linecap="round"/>
  <line x1="745" y1="745" x2="855" y2="855" stroke="#e8eef8" stroke-width="84" stroke-linecap="round"/>
  <circle cx="590" cy="590" r="185" fill="url(#lens)" stroke="#0a1428" stroke-width="78"/>
  <circle cx="590" cy="590" r="185" fill="none" stroke="#e8eef8" stroke-width="48"/>
</svg>
