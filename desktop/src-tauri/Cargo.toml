[package]
name = "coc-autofarm"
version = "0.2.1-beta.1"
description = "CoC AutoFarm - application de bureau"
edition = "2021"
publish = false

# Bibliothèque + exécutable : convention Tauri 2 (le code vit dans lib.rs).
[lib]
name = "coc_autofarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Jeton aléatoire du moteur (générateur cryptographique du système).
getrandom = "0.3"
# Une seule instance (relancer l'application remet la fenêtre au premier plan).
tauri-plugin-single-instance = "2"
# Taille, position et état agrandi de la fenêtre mémorisés entre deux lancements.
tauri-plugin-window-state = "2"
# Mises à jour automatiques signées (GitHub Releases) + redémarrage de l'application.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Comparaison de versions (retour du canal bêta vers le stable).
semver = "1"

[profile.release]
# Exécutable plus petit et plus rapide pour la distribution.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
